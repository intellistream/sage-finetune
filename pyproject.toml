[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isage-finetune"
version = "0.1.0.5"
description = "SAGE Fine-tuning Framework - Trainers and data loaders for LLM fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "IntelliStream Team", email = "shuhao_zhang@hust.edu.cn" }
]
keywords = [
    "finetune",
    "training",
    "LoRA",
    "LLM",
    "AI",
]

dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "isage-libs>=0.2.4.22",
]

[project.optional-dependencies]
full = []

dev = [
    # dev includes [full] — no need for a separate extras install
    "isage-finetune[full]",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
]

[project.urls]
"Homepage" = "https://github.com/intellistream/sage-finetune"
"Repository" = "https://github.com/intellistream/sage-finetune"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sage_libs*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
