[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isage-finetune"
version = "0.0.0.1"
description = "Fine-tuning implementations for SAGE framework - LoRA, QLoRA, and full fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "IntelliStream Team", email = "shuhao_zhang@hust.edu.cn"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.1.0"]
peft = ["peft>=0.5.0", "transformers>=4.30.0", "datasets>=2.0.0"]
full = ["transformers>=4.30.0", "datasets>=2.0.0", "accelerate>=0.20.0"]

[project.urls]
Homepage = "https://github.com/intellistream/sage-finetune"
Repository = "https://github.com/intellistream/sage-finetune"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
